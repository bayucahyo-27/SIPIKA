<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profil Pengguna - SIPIKA</title>

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS Global -->
    <link rel="stylesheet" href="../../css/global.css" />

    <!-- CSS Utama Petugas -->
    <link rel="stylesheet" href="../../css/petugas.css" />
  </head>

  <body class="profile-page">
    <div class="app-container">
      <!-- =================================
             SIDEBAR
        ================================== -->

      <aside class="sidebar">
        <div class="sidebar-brand">
          <img
            src="../../assets/images/logo.png"
            alt="Logo SIPIKA"
            class="logo-img"
          />
        </div>

        <ul class="sidebar-menu">
          <li>
            <a href="dashboard.html">
              <i class="fa-solid fa-house"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li>
            <a href="dataset.html">
              <i class="fa-solid fa-database"></i>
              <span>Data Dataset</span>
            </a>
          </li>

          <li>
            <a href="evaluasi-model.html">
              <i class="fa-solid fa-chart-line"></i>
              <span>Evaluasi Model</span>
            </a>
          </li>

          <li>
            <a href="riwayat-prediksi.html">
              <i class="fa-solid fa-clock-rotate-left"></i>
              <span>Riwayat Prediksi</span>
            </a>
          </li>

          <li class="active">
            <a href="profil.html">
              <i class="fa-solid fa-user"></i>
              <span>Profil</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <a href="#" id="btnLogout" class="logout-btn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </div>
      </aside>

      <!-- =================================
             MAIN CONTENT
        ================================== -->

      <main class="main-content">
        <!-- TOPBAR MENGIKUTI DASHBOARD -->
        <header class="top-navbar">
          <div class="user-profile-badge">
            <div class="profile-avatar">
              <i class="fa-solid fa-user"></i>
            </div>

            <div class="profile-info">
              <span class="profile-name">Bayu Cahyo</span>
              <span class="profile-role">Petugas</span>
            </div>
          </div>
        </header>

        <!-- =================================
                 CONTENT BODY
            ================================== -->

        <div class="content-body profile-content-body">
          <!-- BANNER PROFIL -->
          <div
            class="welcome-banner profile-welcome-banner"
            style="
              background-image:
                linear-gradient(
                  90deg,
                  rgba(248, 250, 252, 0.97) 0%,
                  rgba(248, 250, 252, 0.92) 30%,
                  rgba(248, 250, 252, 0.65) 43%,
                  rgba(248, 250, 252, 0.2) 52%,
                  rgba(248, 250, 252, 0) 62%
                ),
                url(&quot;../../assets/images/banner.jpg&quot;);
            "
          >
            <div class="banner-text">
              <div class="profile-banner-label">
                <span class="banner-tag">PROFIL</span>
                <span class="profile-banner-line"></span>
              </div>

              <h1>Profil Pengguna</h1>

              <p>Kelola informasi akun Anda.</p>
            </div>
          </div>

          <!-- =================================
                     GRID PROFIL (DUA KOLOM)
                ================================== -->

          <div class="profile-grid">
            <!-- =================================
                         KOLOM KIRI: INFORMASI PROFIL
                    ================================== -->

            <section class="content-card profile-info-card">
              <!-- JUDUL KARTU -->
              <div class="card-header-title">
                <div class="icon-circle-badge">
                  <i class="fa-solid fa-user icon-blue"></i>
                </div>

                <h3>Informasi Profil</h3>
              </div>

              <!-- AVATAR DAN UPLOAD FOTO -->
              <div class="profile-avatar-wrapper">
                <div class="profile-avatar-container">
                  <div class="avatar-large">
                    <i class="fa-solid fa-user" id="defaultAvatarIcon"></i>

                    <img
                      src=""
                      id="uploadedAvatarImg"
                      alt="Foto Profil"
                      style="display: none"
                    />
                  </div>

                  <!-- TOMBOL GANTI FOTO -->
                  <label
                    for="uploadFotoInput"
                    class="upload-badge"
                    title="Ganti Foto Profil"
                  >
                    <i class="fa-solid fa-camera"></i>
                  </label>
                </div>

                <!-- INPUT FILE -->
                <input
                  type="file"
                  id="uploadFotoInput"
                  accept="image/*"
                  hidden
                />

                <h4 class="profile-username" id="displayUsername">bayu</h4>

                <span class="badge-role" id="displayRoleBadge">Petugas</span>
              </div>

              <!-- DETAIL INFORMASI PROFIL -->
              <div class="profile-detail-list">
                <!-- EMAIL -->
                <div class="profile-detail-item">
                  <div class="detail-label">
                    <div class="icon-circle-badge-small">
                      <i class="fa-solid fa-envelope icon-blue"></i>
                    </div>

                    <span>Email</span>
                  </div>

                  <div class="detail-value">
                    <span class="separator">:</span>
                    <span id="displayEmail">-</span>
                  </div>
                </div>

                <!-- NAMA LENGKAP -->
                <div class="profile-detail-item">
                  <div class="detail-label">
                    <div class="icon-circle-badge-small">
                      <i class="fa-solid fa-user icon-blue"></i>
                    </div>

                    <span>Nama Lengkap</span>
                  </div>

                  <div class="detail-value">
                    <span class="separator">:</span>
                    <span id="displayNamaLengkap">Bayu Cahyo</span>
                  </div>
                </div>

                <!-- ROLE -->
                <div class="profile-detail-item">
                  <div class="detail-label">
                    <div class="icon-circle-badge-small">
                      <i class="fa-solid fa-users icon-blue"></i>
                    </div>

                    <span>Role</span>
                  </div>

                  <div class="detail-value">
                    <span class="separator">:</span>
                    <span id="displayRole">Petugas</span>
                  </div>
                </div>
              </div>
            </section>

            <!-- =================================
                         KOLOM KANAN: UBAH PASSWORD
                    ================================== -->

            <section class="content-card profile-password-card">
              <!-- JUDUL KARTU -->
              <div class="card-header-title">
                <div class="icon-circle-badge">
                  <svg
                    class="profile-lock-icon"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                  >
                    <!-- Lengkungan gembok -->
                    <path
                      d="M8 10V7a4 4 0 1 1 8 0v3"
                      fill="none"
                      stroke="#0875f5"
                      stroke-width="2.3"
                      stroke-linecap="round"
                    />

                    <!-- Badan gembok -->
                    <rect
                      x="5"
                      y="10"
                      width="14"
                      height="12"
                      rx="2.5"
                      fill="#0875f5"
                    />

                    <!-- Lubang kunci -->
                    <circle cx="12" cy="15" r="1.3" fill="#ffffff" />

                    <path d="M11.3 16h1.4l0.7 3h-2.8z" fill="#ffffff" />
                  </svg>
                </div>

                <h3>Ubah Password</h3>
              </div>

              <!-- FORM UBAH PASSWORD -->
              <form
                id="formUbahPassword"
                class="profile-password-form"
                onsubmit="event.preventDefault()"
              >
                <!-- PASSWORD SAAT INI -->
                <div class="form-group-password">
                  <label for="inputCurrentPassword"> Password Saat Ini </label>

                  <div class="input-password-wrapper">
                    <input
                      type="password"
                      id="inputCurrentPassword"
                      placeholder="Masukkan password saat ini"
                    />

                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                  </div>
                </div>

                <!-- PASSWORD BARU -->
                <div class="form-group-password">
                  <label for="inputNewPassword"> Password Baru </label>

                  <div class="input-password-wrapper">
                    <input
                      type="password"
                      id="inputNewPassword"
                      placeholder="Masukkan password baru"
                    />

                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                  </div>
                </div>

                <!-- KONFIRMASI PASSWORD -->
                <div class="form-group-password">
                  <label for="inputConfirmPassword">
                    Konfirmasi Password Baru
                  </label>

                  <div class="input-password-wrapper">
                    <input
                      type="password"
                      id="inputConfirmPassword"
                      placeholder="Masukkan kembali password baru"
                    />

                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                  </div>
                </div>

                <!-- TOMBOL FORM -->
                <div class="form-actions-profile">
                  <button
                    type="button"
                    class="btn-batal"
                    onclick="resetFormPassword()"
                  >
                    Batal
                  </button>

                  <button
                    type="button"
                    class="btn-simpan"
                    onclick="simpanPassword()"
                  >
                    Ubah Password
                  </button>
                </div>
              </form>
            </section>
          </div>
        </div>

        <!-- FOOTER MENGIKUTI DASHBOARD -->
        <footer class="footer-copyright">
          <p>&copy; 2026 SIPIKA - Kelompok 13 Web</p>
        </footer>
      </main>
    </div>

    <!-- SCRIPT GLOBAL & PETUGAS -->
    <script src="../../js/global.js"></script>
    <script src="../../js/petugas.js"></script>
  </body>
</html>
