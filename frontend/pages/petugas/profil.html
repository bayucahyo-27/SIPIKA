<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Pengguna - SIPIKA</title>
  
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="../../css/petugas.css">
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="../../assets/images/logo.png" alt="SIPIKA Logo" class="sidebar-logo-img">
      </div>
      
      <div class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>
        <a href="dataset.html" class="menu-item">
          <i class="fa-solid fa-database"></i>
          <span>Data Dataset</span>
        </a>
        <a href="evaluasi-model.html" class="menu-item">
          <i class="fa-solid fa-chart-column"></i>
          <span>Evaluasi Model</span>
        </a>
        <a href="riwayat-prediksi.html" class="menu-item">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>Riwayat Prediksi</span>
        </a>
        <a href="profil.html" class="menu-item active">
          <i class="fa-solid fa-user"></i>
          <span>Profil</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <a href="../../index.html" class="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      
      <!-- TOPBAR INFO PROFIL -->
      <header class="topbar">
        <div class="topbar-user">
          <div class="user-avatar-small">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="user-info-text">
            <span class="user-name">Bayu Cahyo</span>
            <span class="user-status"><span class="status-dot"></span> Petugas</span>
          </div>
        </div>
      </header>

      <!-- CONTENT BODY -->
      <div class="content-body">

        <!-- WELCOME BANNER -->
        <div class="banner-card welcome-banner" style="background-image: url('../../assets/images/banner.jpeg');">
          <div class="banner-text">
            <h2>Profil Pengguna</h2>
            <p>Kelola informasi akun Anda.</p>
          </div>
        </div>

        <!-- GRID KONTAINER PROFIL (2 KOLOM) -->
        <div class="profile-grid">

          <!-- KOLOM KIRI: INFORMASI PROFIL -->
          <div class="content-card profile-info-card">
            <div class="card-header-title">
              <div class="icon-circle-badge">
                <i class="fa-solid fa-user icon-blue"></i>
              </div>
              <h3>Informasi Profil</h3>
            </div>

            <!-- AVATAR & UPLOAD FOTO (FUNGSI GANTI FOTO NORMAL) -->
            <div class="profile-avatar-wrapper">
              <div class="profile-avatar-container">
                <div class="avatar-large">
                  <i class="fa-solid fa-user" id="defaultAvatarIcon"></i>
                  <img src="" id="uploadedAvatarImg" alt="Foto Profil" style="display: none;">
                </div>

                <!-- Tombol Kamera (Langsung Membuka File Explorer untuk Ganti Foto) -->
                <label for="uploadFotoInput" class="upload-badge" title="Ganti Foto Profil">
                  <i class="fa-solid fa-camera"></i>
                </label>
              </div>

              <!-- Input File Tersembunyi -->
              <input type="file" id="uploadFotoInput" accept="image/*" style="display: none;" onchange="previewImage(this)">

              <h4 class="profile-username">bayu</h4>
              <span class="badge-role">Petugas</span>
            </div>

            <!-- DETAIL INFORMASI (DENGAN ICON BERBACKGROUND BIRU MUDA) -->
            <div class="profile-detail-list">
              <div class="profile-detail-item">
                <div class="detail-label">
                  <div class="icon-circle-badge-small">
                    <i class="fa-solid fa-user icon-blue"></i>
                  </div>
                  <span>Nama Lengkap</span>
                </div>
                <div class="detail-value">
                  <span class="separator">:</span>
                  <span>Bayu Cahyo</span>
                </div>
              </div>

              <div class="profile-detail-item">
                <div class="detail-label">
                  <div class="icon-circle-badge-small">
                    <i class="fa-solid fa-phone icon-blue"></i>
                  </div>
                  <span>Nomor Telepon</span>
                </div>
                <div class="detail-value">
                  <span class="separator">:</span>
                  <span>0812 8886 1234</span>
                </div>
              </div>

              <div class="profile-detail-item">
                <div class="detail-label">
                  <div class="icon-circle-badge-small">
                    <i class="fa-solid fa-users icon-blue"></i>
                  </div>
                  <span>Role</span>
                </div>
                <div class="detail-value">
                  <span class="separator">:</span>
                  <span>Petugas</span>
                </div>
              </div>
            </div>

          </div>

          <!-- KOLOM KANAN: UBAH PASSWORD -->
          <div class="content-card profile-password-card">
            <div class="card-header-title">
              <div class="icon-circle-badge">
                <i class="fa-solid fa-lock icon-blue"></i>
              </div>
              <h3>Ubah Password</h3>
            </div>

            <form id="formUbahPassword" onsubmit="event.preventDefault();">
              <div class="form-group-password">
                <label>Password Saat Ini</label>
                <div class="input-password-wrapper">
                  <input type="password" id="inputCurrentPassword" placeholder="Masukkan password saat ini">
                  <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePasswordVisibility('inputCurrentPassword', this)"></i>
                </div>
              </div>

              <div class="form-group-password">
                <label>Password Baru</label>
                <div class="input-password-wrapper">
                  <input type="password" id="inputNewPassword" placeholder="Masukkan password baru">
                  <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePasswordVisibility('inputNewPassword', this)"></i>
                </div>
              </div>

              <div class="form-group-password">
                <label>Konfirmasi Password Baru</label>
                <div class="input-password-wrapper">
                  <input type="password" id="inputConfirmPassword" placeholder="Masukkan kembali password baru">
                  <i class="fa-regular fa-eye-slash toggle-password" onclick="togglePasswordVisibility('inputConfirmPassword', this)"></i>
                </div>
              </div>

              <div class="form-actions-profile">
                <button type="button" class="btn-batal" onclick="resetFormPassword()">Batal</button>
                <button type="button" class="btn-simpan" onclick="simpanPassword()">Ubah Password</button>
              </div>
            </form>
          </div>

        </div>

      </div>

      <!-- FOOTER -->
      <footer class="main-footer">
        <p>&copy; 2026 SIPIKA &mdash; Kelompok 13 Web</p>
      </footer>
    </main>
  </div>

  <script>
    const uploadInput = document.getElementById('uploadFotoInput');
    const uploadedImg = document.getElementById('uploadedAvatarImg');
    const defaultIcon = document.getElementById('defaultAvatarIcon');

    uploadInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedImg.src = evt.target.result;
          uploadedImg.style.display = 'block';
          defaultIcon.style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    function togglePasswordVisibility(inputId, iconElem) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        iconElem.classList.remove('fa-eye-slash');
        iconElem.classList.add('fa-eye');
      } else {
        input.type = 'password';
        iconElem.classList.remove('fa-eye');
        iconElem.classList.add('fa-eye-slash');
      }
    }

    function resetFormPassword() {
      document.getElementById('formUbahPassword').reset();
    }

    function simpanPassword() {
      const curr = document.getElementById('inputCurrentPassword').value;
      const newP = document.getElementById('inputNewPassword').value;
      const conf = document.getElementById('inputConfirmPassword').value;

      if (!curr || !newP || !conf) {
        alert('Harap isi semua kolom password!');
        return;
      }
      if (newP !== conf) {
        alert('Konfirmasi password tidak cocok dengan password baru!');
        return;
      }

      alert('Password berhasil diperbarui!');
      resetFormPassword();
    }
  </script>
</body>
</html>
