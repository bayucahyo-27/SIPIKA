<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Mengatur karakter agar mendukung berbagai jenis teks -->
    <meta charset="UTF-8">

    <!-- Mengatur tampilan halaman agar menyesuaikan ukuran perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Judul halaman yang ditampilkan pada tab browser -->
    <title>Daftar Akun | SIPIKA</title>

    <!-- Menghubungkan Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Menghubungkan file CSS utama untuk mengatur tampilan halaman autentikasi -->
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body>

    <!-- Kontainer utama halaman registrasi -->
    <main class="login-page register-page">

        <!-- Bagian kiri: Identitas SIPIKA -->
        <section class="brand-section" aria-label="Identitas SIPIKA">

            <div class="brand-content">

                <!-- Logo SIPIKA -->
                <img
                    src="../../assets/images/logo_sipika.png"
                    alt="Logo SIPIKA"
                    class="brand-logo"
                >

                <!-- Deskripsi singkat sistem -->
                <p class="brand-description">
                    Sistem Klasifikasi Produksi
                    <br>
                    Ikan Tangkapan di Maluku Utara
                </p>

                <!-- Elemen dekorasi pada bagian identitas -->
                <div class="brand-decoration"></div>

            </div>

        </section>


        <!-- Bagian kanan: Form pendaftaran akun -->
        <section class="login-section register-section" aria-label="Form pendaftaran">

            <div class="login-card register-card">

                <!-- Header atau judul halaman registrasi -->
                <header class="login-header register-header">
                    <h2>Daftar Akun</h2>
                </header>


                <!-- Form untuk memasukkan data pendaftaran akun -->
                <form id="registerForm" class="login-form register-form">

                    <!-- Input email pengguna -->
                    <div class="form-group">
                        <label for="email">MASUKKAN EMAIL</label>

                        <div class="input-wrapper">

                            <!-- Kolom untuk memasukkan alamat email -->
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Masukkan email"
                                required
                            >

                        </div>
                    </div>


                    <!-- Input kata sandi -->
                    <div class="form-group">
                        <label for="password">KATA SANDI</label>

                        <div class="input-wrapper">

                            <!-- Kolom untuk membuat kata sandi -->
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Masukkan kata sandi"
                                required
                            >

                        </div>
                    </div>


                    <!-- Input konfirmasi kata sandi -->
                    <div class="form-group">
                        <label for="confirmPassword">
                            KONFIRMASI KATA SANDI
                        </label>

                        <div class="input-wrapper">

                            <!-- Kolom untuk memasukkan ulang kata sandi -->
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Masukkan kembali kata sandi"
                                required
                            >

                        </div>
                    </div>


                    <!-- Tombol untuk mengirim data pendaftaran -->
                    <button type="submit" class="login-button register-button">
                        DAFTAR AKUN
                    </button>


                    <!-- Tautan untuk kembali ke halaman login -->
                    <div class="register-footer">
                        <p>
                            Sudah punya akun?
                            <a href="login.html">Masuk Kembali</a>
                        </p>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- Menghubungkan file JavaScript untuk menangani interaksi halaman autentikasi -->
    <script src="../../js/auth.js"></script>

</body>
</html>
