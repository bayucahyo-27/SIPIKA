<!doctype html>
<html lang="id">
  <head>
    <!-- Mengatur karakter agar mendukung berbagai jenis teks -->
    <meta charset="UTF-8" />

    <!-- Mengatur tampilan halaman agar menyesuaikan ukuran perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Judul halaman yang ditampilkan pada tab browser -->
    <title>Atur Ulang Kata Sandi | SIPIKA</title>

    <!-- Menghubungkan file CSS utama untuk mengatur tampilan halaman autentikasi -->
    <link rel="stylesheet" href="../../css/auth.css" />
  </head>

  <body>
    <!-- Kontainer utama halaman lupa password -->
    <main class="forgot-page">
      <!-- Card yang membungkus seluruh konten pemulihan kata sandi -->
      <section class="forgot-card">
        <!-- Header atau judul dan petunjuk halaman lupa password -->
        <header class="forgot-header">
          <h2>ATUR ULANG KATA SANDI</h2>
          <p>
            Masukkan email terdaftar untuk menerima
            <br />
            link pemulihan
          </p>
        </header>

        <!-- Form untuk mengirim permintaan pemulihan kata sandi -->
        <form class="forgot-form" id="forgotForm">
          <!-- Input email yang terdaftar pada sistem -->
          <div class="form-group">
            <label for="email">EMAIL TERDAFTAR</label>

            <div class="input-wrapper">
              <!-- Kolom untuk memasukkan alamat email pengguna -->
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Masukkan email anda..."
              />
            </div>
          </div>

          <!-- Tombol untuk mengirim tautan pemulihan kata sandi -->
          <button type="submit" class="forgot-button">
            KIRIM TAUTAN PEMULIHAN
          </button>
        </form>

        <!-- Tautan untuk kembali ke halaman login -->
        <div class="forgot-back">
          <a href="login.html">KEMBALI KE LOGIN</a>
        </div>
      </section>
    </main>
    <script src="../../js/global.js"></script>
    <script src="../../js/auth.js"></script>
  </body>
</html>
