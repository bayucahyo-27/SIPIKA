<!doctype html>
<html lang="id">
  <head>
    <!-- Mengatur karakter agar mendukung berbagai jenis teks -->
    <meta charset="UTF-8" />

    <!-- Mengatur tampilan halaman agar menyesuaikan ukuran perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Judul halaman yang ditampilkan pada tab browser -->
    <title>Reset Password | SIPIKA</title>

    <!-- Menghubungkan Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Menghubungkan file CSS utama untuk mengatur tampilan halaman autentikasi -->
    <link rel="stylesheet" href="../../css/auth.css" />
  </head>

  <body>
    <!-- Kontainer utama halaman reset password -->
    <main class="reset-page">
      <!-- Card yang membungkus seluruh konten reset password -->
      <section class="reset-card">
        <!-- Header atau judul halaman reset password -->
        <header class="reset-header">
          <h2>RESET PASSWORD</h2>
        </header>

        <!-- Form untuk memasukkan password baru -->
        <form class="reset-form" id="resetForm">
          <!-- Input password baru -->
          <div class="form-group">
            <label for="newPassword">Password Baru</label>

            <div class="input-wrapper">
              <!-- Kolom untuk memasukkan password baru -->
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Masukkan password baru..."
              />
            </div>
          </div>

          <!-- Input konfirmasi password baru -->
          <div class="form-group">
            <label for="confirmPassword">Konfirmasi Password Baru</label>

            <div class="input-wrapper">
              <!-- Kolom untuk memasukkan ulang password baru -->
              <input
                type="password"
                id="resetConfirmPassword"
                name="resetConfirmPassword"
                placeholder="Masukkan ulang password baru..."
              />
            </div>
          </div>

          <!-- Tombol untuk mengirim dan menyimpan password baru -->
          <button type="submit" class="reset-button">
            SIMPAN PASSWORD BARU
          </button>
        </form>

        <!-- Tautan untuk kembali ke halaman login -->
        <div class="reset-back">
          <a href="login.html">KEMBALI KE LOGIN</a>
        </div>
      </section>
    </main>

    <!-- Menghubungkan file JavaScript untuk menangani interaksi halaman autentikasi -->
    <script src="../../js/global.js"></script>
    <script src="../../js/auth.js"></script>
  </body>
</html>
