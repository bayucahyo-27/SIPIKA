<!doctype html>
<html lang="id">
  <head>
    <!-- Mengatur karakter agar mendukung berbagai jenis teks -->
    <meta charset="UTF-8" />

    <!-- Mengatur tampilan halaman agar menyesuaikan ukuran perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Judul halaman yang ditampilkan pada tab browser -->
    <title>Reset Password | SIPIKA</title>

    <!-- Menghubungkan Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Menghubungkan file CSS utama untuk mengatur tampilan halaman autentikasi -->
    <link rel="stylesheet" href="../../css/auth.css" />
  </head>

  <body>
    <!-- Kontainer utama halaman reset password -->
    <main class="reset-page">
      <!-- Card yang membungkus seluruh konten reset password -->
      <section class="reset-card">
        <!-- Header atau judul halaman reset password -->
        <header class="reset-header">
          <h2>RESET PASSWORD</h2>
        </header>

        <!-- Form untuk memasukkan password baru -->
        <form class="reset-form" id="resetForm">
          <!-- Input password baru -->
          <!-- Input password baru -->
          <div class="form-group">
            <label for="newPassword">Password Baru</label>

            <div class="input-wrapper" style="position: relative">
              <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Masukkan password baru..."
                style="padding-right: 45px"
              />
              <!-- TOMBOL IKON MATA -->
              <button
                type="button"
                id="toggleNewPassword"
                style="
                  position: absolute;
                  right: 12px;
                  top: 50%;
                  transform: translateY(-50%);
                  background: none;
                  border: none;
                  cursor: pointer;
                  padding: 5px;
                  display: flex;
                  align-items: center;
                  color: #666;
                "
              >
                <svg
                  id="newPasswordIcon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                  <path
                    d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.8-.8"
                  />
                </svg>
              </button>
            </div>
            <small class="error-message" id="error-newPassword"></small>
          </div>

          <!-- Input konfirmasi password baru -->
          <div class="form-group">
            <label for="resetConfirmPassword">Konfirmasi Password Baru</label>

            <div class="input-wrapper" style="position: relative">
              <input
                type="password"
                id="resetConfirmPassword"
                name="resetConfirmPassword"
                placeholder="Masukkan ulang password baru..."
                style="padding-right: 45px"
              />
              <!-- TOMBOL IKON MATA -->
              <button
                type="button"
                id="toggleResetConfirmPassword"
                style="
                  position: absolute;
                  right: 12px;
                  top: 50%;
                  transform: translateY(-50%);
                  background: none;
                  border: none;
                  cursor: pointer;
                  padding: 5px;
                  display: flex;
                  align-items: center;
                  color: #666;
                "
              >
                <svg
                  id="resetConfirmPasswordIcon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                  <path
                    d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.8-.8"
                  />
                </svg>
              </button>
            </div>
            <small
              class="error-message"
              id="error-resetConfirmPassword"
            ></small>
          </div>

          <!-- Tombol untuk mengirim dan menyimpan password baru -->
          <button type="submit" class="reset-button">
            SIMPAN PASSWORD BARU
          </button>
        </form>

        <!-- Tautan untuk kembali ke halaman login -->
        <div class="reset-back">
          <a href="login.html">KEMBALI KE LOGIN</a>
        </div>
      </section>
    </main>

    <!-- Menghubungkan file JavaScript untuk menangani interaksi halaman autentikasi -->
    <script src="../../js/global.js"></script>
    <script src="../../js/auth.js"></script>
  </body>
</html>
